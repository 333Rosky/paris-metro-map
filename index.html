<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Carte animée de toutes les rames du métro de Paris, d'après les horaires officiels d'Île-de-France Mobilités." />
    <title>Métro de Paris en mouvement</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%23ffbe00'/><text x='16' y='22' font-size='17' font-family='Arial' font-weight='700' text-anchor='middle'>M</text></svg>" />
  </head>
  <body>
    <div id="map"></div>

    <section id="controls" class="panel" aria-label="Contrôle du temps">
      <div class="row top">
        <div class="clock-block">
          <div id="clock" class="clock">--:--:--</div>
          <select id="date" aria-label="Jour"></select>
        </div>
        <div class="count"><strong id="count">0</strong><span>rames</span></div>
      </div>
      <input id="slider" type="range" min="0" max="86399" step="1" aria-label="Heure" />
      <div class="row">
        <button id="play" class="icon-btn" aria-label="Pause">
          <svg viewBox="0 0 24 24" class="i-pause"><rect x="6" y="5" width="4" height="14" rx="1" /><rect x="14" y="5" width="4" height="14" rx="1" /></svg>
          <svg viewBox="0 0 24 24" class="i-play"><path d="M7 5v14l12-7z" /></svg>
        </button>
        <div id="speeds" class="segmented" role="radiogroup" aria-label="Vitesse"></div>
        <button id="live" class="text-btn live-btn" data-state="off"><span class="live-dot"></span>Direct</button>
      </div>
      <p id="rt-error" class="rt-error" hidden><span></span><button class="link-btn">Modifier la clé</button></p>
      <div id="lines" class="lines" aria-label="Lignes"></div>
    </section>

    <aside id="info" class="panel" hidden>
      <button id="close" class="close" aria-label="Fermer">×</button>
      <div id="info-body"></div>
    </aside>

    <dialog id="key-dialog">
      <form method="dialog">
        <h2>Temps réel</h2>
        <label for="key-input">Clé API PRIM</label>
        <input id="key-input" type="password" autocomplete="off" spellcheck="false" />
        <a href="https://prim.iledefrance-mobilites.fr/" target="_blank" rel="noopener">Obtenir une clé gratuite</a>
        <div class="dialog-actions">
          <!-- "Activer" comes first so that Enter submits it; CSS restores the visual order. -->
          <button value="save" class="text-btn primary">Activer</button>
          <button value="schedule" class="text-btn">Horaires théoriques</button>
          <button value="forget" id="key-forget" class="link-btn">Supprimer la clé</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
